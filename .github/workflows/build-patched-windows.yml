name: Build NexusAI Windows CUDA candidate

on:
  workflow_dispatch:
  push:
    branches: [nexusai/update-20261015]

permissions:
  contents: write

concurrency:
  group: nexusai-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-patched-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64
      - name: Install Ninja
        run: choco install ninja -y
      - name: Build server with CUDA and CPU fallback
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=86 ^
            -DGGML_CUDA_CCCL_VERSION=v3.4.3 ^
            -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON -DGGML_CUDA=ON -DGGML_RPC=ON
          if errorlevel 1 exit /b 1
          cmake --build build --config Release -j 4 --target llama-server
          if errorlevel 1 exit /b 1
      - name: Regression test on CPU before publishing candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $url = 'https://huggingface.co/ggml-org/test-model-stories260K/resolve/479896ec924af6d40fd419ab8f4d1eb2101de00d/stories260K-f32.gguf'
          Invoke-WebRequest $url -OutFile smoke/model.gguf
          $hash = (Get-FileHash smoke/model.gguf -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d') { throw 'Model checksum mismatch' }
          python tests/nexusai/prefill_regression.py --binary build/bin/Release/llama-server.exe --model smoke/model.gguf --output smoke/results
          if ($LASTEXITCODE -ne 0) { throw 'Prefill regression failed' }
      - name: Package and record provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/bin/Release/llama-server.exe package/
          Copy-Item build/bin/Release/*.dll package/
          Copy-Item smoke/results/results.json package/regression-results.json
          $files = @{}
          Get-ChildItem package -File | ForEach-Object { $files[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          @{
            schema_version = 1
            source_commit = $env:GITHUB_SHA
            upstream_commit = 'b76b13379d3b7d67ab0bc424516bb6fd2522bd8e'
            cuda = '12.4'; architectures = @(86)
            candidate_only = $true
            features = @('use_slot_prompt', 'explicit_slot_required', 'recurrent_rollback', 'upstream_checkpoint_persistence', 'pooled_embedding_no_lm_head')
            files_sha256 = $files
          } | ConvertTo-Json -Depth 5 | Set-Content package/build-manifest.json -Encoding utf8
          Compress-Archive package/* llama-nexusai-win-cuda12.4-sm86.zip
          (Get-FileHash llama-nexusai-win-cuda12.4-sm86.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content llama-nexusai-win-cuda12.4-sm86.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-windows-candidate
          path: |
            llama-nexusai-win-cuda12.4-sm86.zip
            llama-nexusai-win-cuda12.4-sm86.zip.sha256
            smoke/results/
      - name: Publish uniquely named candidate for isolated worker testing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'nexusai-20261015-' + $env:GITHUB_SHA.Substring(0,12)
          gh release create $tag llama-nexusai-win-cuda12.4-sm86.zip llama-nexusai-win-cuda12.4-sm86.zip.sha256 --prerelease --latest=false --target $env:GITHUB_SHA --title "NexusAI CUDA 12.4 candidate $tag" --notes 'Candidate build for isolated testing. Includes NexusAI prefill compatibility patches and upstream changes through b76b13379. Not deployed automatically.'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate publication failed' }
